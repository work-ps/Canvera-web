<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Square photobook cover: equal width and height -->
  <rect x="9" y="9" width="46" height="46" rx="4" stroke="#2E5955" stroke-width="2"/>
  <!-- Spine line on left edge -->
  <line x1="18" y1="9" x2="18" y2="55" stroke="#2E5955" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Photo window on cover -->
  <rect x="22" y="15" width="28" height="34" rx="2.5" stroke="#2E5955" stroke-width="1.5" opacity="0.6"/>
</svg>
