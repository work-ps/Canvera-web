<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Portrait photobook cover: taller than wide -->
  <rect x="19" y="5" width="26" height="54" rx="4" stroke="#2E5955" stroke-width="2"/>
  <!-- Spine line on left edge -->
  <line x1="19" y1="14" x2="45" y2="14" stroke="#2E5955" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Photo window on cover -->
  <rect x="24" y="18" width="16" height="34" rx="2.5" stroke="#2E5955" stroke-width="1.5" opacity="0.6"/>
</svg>
