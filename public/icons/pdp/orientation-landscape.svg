<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Landscape photobook cover: wider than tall -->
  <rect x="5" y="19" width="54" height="34" rx="4" stroke="#2E5955" stroke-width="2"/>
  <!-- Spine line on left edge -->
  <line x1="14" y1="19" x2="14" y2="53" stroke="#2E5955" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Photo window on cover -->
  <rect x="18" y="25" width="36" height="22" rx="2.5" stroke="#2E5955" stroke-width="1.5" opacity="0.6"/>
</svg>
